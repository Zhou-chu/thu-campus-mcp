name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node bin/thu-campus.mjs browser install
      - if: matrix.node == 22
        run: npm run check
      - if: matrix.node == 24
        run: npm run typecheck && npm run build && npm run licenses:check && npm run audit:source && npm run audit:smells
      - name: 完整测试与LCOV（含真实浏览器）
        if: matrix.node == 24
        run: npm run test:coverage
      - name: 校验四份完整源码与报告
        if: always() && matrix.node == 24
        run: node scripts/coverage.mjs --verify-reports
      - name: 上传真实覆盖率报告
        if: always() && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-lcov
          path: |
            coverage/lcov.info
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/coverage-manifest.json
            coverage/unit/
            coverage/tooling/
            coverage/html/
          retention-days: 14
          if-no-files-found: error
      - name: 结构健康门禁（dependency-cruiser）
        run: npm run arch:check
      - name: WebUI 端到端（真实 Chromium）
        if: matrix.node == 22
        run: npm run e2e:web
      - name: 邮箱模式服务页端到端（真实 Chromium）
        if: matrix.node == 22
        run: npm run e2e:auth-services
      - name: 座位取消端到端（真实 Chromium，校园替身）
        if: matrix.node == 22
        run: npm run e2e:seat-cancel
      - name: 课表用户旅程（真实 Chromium，网络学堂替身）
        if: matrix.node == 22
        run: npm run e2e:course
      - name: 邮箱首轮对话旅程（真实 Chromium，模型替身）
        if: matrix.node == 22
        run: npm run e2e:email-chat
      - run: npm run verify:clients
      - run: npm run smoke
      - run: npm run bundle
      - if: matrix.node == 24
        run: npm run bundle:prepared
      - if: matrix.node == 24
        run: node scripts/verify-prepared.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-mcp-source-node-${{ matrix.node }}
          path: .local/release/thu-campus-mcp-source.zip*
          retention-days: 14
          if-no-files-found: error
      - if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: thu-campus-mcp-windows-x64
          path: .local/release/thu-campus-mcp-windows-x64.zip*
          retention-days: 14
          if-no-files-found: error
      - name: 生产代码覆盖率下限（90%）
        if: matrix.node == 24
        run: npm run coverage:check

  sonar:
    name: SonarQube Cloud / main
    needs: verify
    if: ${{ always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: 下载同一提交的LCOV
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sonar-lcov
          path: coverage
      - name: 验证覆盖率报告完整性
        run: node scripts/coverage.mjs --verify-reports
      - name: 真实Sonar分析与质量门
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  android:
    name: Android debug APK
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: 构建调试 APK
        working-directory: apps/mobile-android
        run: .\gradlew.bat :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
      - name: 校验 APK 结构
        working-directory: apps/mobile-android
        shell: pwsh
        run: |
          $apk = "app/build/outputs/apk/debug/app-debug.apk"
          if (-not (Test-Path $apk)) { throw "未生成 APK" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $apk))[0..3]
          if ((($bytes | ForEach-Object { $_.ToString('X2') }) -join ' ') -ne '50 4B 03 04') { throw "APK 不是合法 ZIP" }
          "{0:N2} MB" -f ((Get-Item $apk).Length / 1MB)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-app-android-debug
          path: apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error


  release:
    name: Manual release gate
    needs: [verify, sonar]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@8df1039502a15bceb9433410b1a100fbe190c53b # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: node bin/thu-campus.mjs browser install
      - name: 构建 Android 调试包
        working-directory: apps/mobile-android
        run: .\gradlew.bat :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain
      - name: 发布门禁（CI 无 DevEco，因此只要求四项目标中的三项）
        run: node scripts/verify-clients.mjs --strict --require webui,desktop,android,runtime
      - run: npm run check
      - name: 结构健康门禁（dependency-cruiser）
        run: npm run arch:check
      - name: WebUI 端到端（真实 Chromium）
        run: npm run e2e:web
      - run: npm run bundle
      - run: npm run bundle:prepared
      - run: node scripts/verify-prepared.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-mcp-release-source
          path: .local/release/thu-campus-mcp-source.zip*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-mcp-release-windows-x64
          path: .local/release/thu-campus-mcp-windows-x64.zip*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-app-release-android
          path: apps/mobile-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

