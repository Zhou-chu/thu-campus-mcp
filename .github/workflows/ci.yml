name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node bin/thu-campus.mjs browser install
      - run: npm run check
      - name: WebUI 端到端（真实 Chromium）
        run: npm run e2e:web
      - run: npm run verify:clients
      - run: npm run smoke
      - run: npm run bundle
      - if: matrix.node == 24
        run: npm run bundle:prepared
      - if: matrix.node == 24
        run: node scripts/verify-prepared.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-mcp-source-node-${{ matrix.node }}
          path: .local/release/thu-campus-mcp-source.zip*
          retention-days: 14
          if-no-files-found: error
      - if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: thu-campus-mcp-windows-x64
          path: .local/release/thu-campus-mcp-windows-x64.zip*
          retention-days: 14
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6e674f4b715d2a6dd0342bdb276069bd9a457c5 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - name: 构建调试 APK
        working-directory: mobile/android
        run: .\gradlew.bat assembleDebug --no-daemon --console=plain
      - name: 校验 APK 结构
        working-directory: mobile/android
        shell: pwsh
        run: |
          $apk = "app/build/outputs/apk/debug/app-debug.apk"
          if (-not (Test-Path $apk)) { throw "未生成 APK" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $apk))[0..3]
          if ((($bytes | ForEach-Object { $_.ToString('X2') }) -join ' ') -ne '50 4B 03 04') { throw "APK 不是合法 ZIP" }
          "{0:N2} MB" -f ((Get-Item $apk).Length / 1MB)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-app-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error


  release:
    name: Manual release gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@b6e674f4b715d2a6dd0342bdb276069bd9a457c5 # v4.5.0
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: node bin/thu-campus.mjs browser install
      - name: 构建 Android 调试包
        working-directory: mobile/android
        run: .\gradlew.bat assembleDebug --no-daemon --console=plain
      - name: 发布门禁（CI 无 DevEco，因此只要求四项目标中的三项）
        run: node scripts/verify-clients.mjs --strict --require webui,desktop,android,runtime
      - run: npm run check
      - name: WebUI 端到端（真实 Chromium）
        run: npm run e2e:web
      - run: npm run bundle
      - run: npm run bundle:prepared
      - run: node scripts/verify-prepared.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-mcp-release-source
          path: .local/release/thu-campus-mcp-source.zip*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-mcp-release-windows-x64
          path: .local/release/thu-campus-mcp-windows-x64.zip*
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-app-release-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

