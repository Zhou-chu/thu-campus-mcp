name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Windows / Node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node bin/thu-campus.mjs browser install
      - run: npm run check
      - run: npm run smoke
      - run: npm run bundle
      - if: matrix.node == 24
        run: npm run bundle:prepared
      - if: matrix.node == 24
        run: node scripts/verify-prepared.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thu-campus-mcp-source-node-${{ matrix.node }}
          path: .local/release/thu-campus-mcp-source.zip*
          retention-days: 14
          if-no-files-found: error
      - if: matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: thu-campus-mcp-windows-x64
          path: .local/release/thu-campus-mcp-windows-x64.zip*
          retention-days: 14
          if-no-files-found: error
