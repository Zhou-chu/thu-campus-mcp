sonar.projectKey=Zhou-chu_thu-campus-mcp
sonar.organization=zhou-chu
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# 源码与测试必须互不重叠，否则扫描器会拒绝同一文件同时出现在两者中。
# 但两边都要真的被分析：基线里 scripts/ 有 15 条、test/ 有 1 条真实发现，
# 因此这里只把“构建产物/依赖/缓存”排除出源码，测试目录改由 sonar.tests 收口，
# 不做“把有问题的目录整段排除”的关闭式处理。
sonar.sources=.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.local/**,\
  coverage/**,\
  **/test/**,\
  **/*.test.mjs,\
  **/*.test.ts,\
  **/build/**,\
  **/.gradle/**

# 测试源码（会被分析，只是按测试文件的规则与口径处理）。
sonar.tests=test,desktop/test,packages/hetang/test,packages/learnx/test,packages/thu-cloud/test,packages/browser/test,mobile/android/app/src/test
sonar.test.inclusions=**/test/**,**/*.test.mjs,**/*.test.ts

# Sonar 消费 combined 报告（unit + 真实浏览器 E2E 的并集，是两份里覆盖面更大的那份）。
# unit 单独那份 LCOV 只用于 CI 里独立的 90% 单元覆盖率门禁，两者口径在 docs/sonarqube.md 有对照。
sonar.javascript.lcov.reportPaths=coverage/lcov.info