sonar.projectKey=Zhou-chu_thu-campus-mcp
sonar.organization=zhou-chu
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# 新analysis scope UX默认分析整个项目；旧sources/tests/test.inclusions参数无效。
# 只排除依赖、缓存与构建产物；测试与mock必须继续接受真实分析。
# 不猜测新测试分类参数；下一次真实扫描须核对测试分类和实际索引结果。
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.local/**,\
  coverage/**,\
  **/build/**,\
  **/.gradle/**

# 原runtime+SDK combined与独立scripts tooling均来自同一次真实V8采集。
# runtime+SDK unit/combined仍保留各自原范围与90%四指标门禁。
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/tooling/lcov.info