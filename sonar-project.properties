sonar.projectKey=Zhou-chu_thu-campus-mcp
sonar.organization=zhou-chu
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# 既有项目保留显式MAIN/TEST分类。自动配置Beta会忽略这些范围参数，必须关闭。
# sources/tests均从全仓开始；test.inclusions只改变角色，测试仍参与TEST规则分析。
sonar.scanner.autoconfig.enabled=false
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/test/**,**/tests/**,**/__tests__/**,**/*.test.*,**/*.spec.*

# 只排除依赖、缓存与构建产物；不配置test.exclusions或coverage.exclusions。
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/.local/**,\
  coverage/**,\
  **/build/**,\
  **/.gradle/**

# 原runtime+SDK combined与独立scripts tooling均来自同一次真实V8采集。
# runtime+SDK unit/combined仍保留各自原范围与90%四指标门禁。
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/tooling/lcov.info