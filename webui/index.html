<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="清华校园独立助手：网络学堂、清华云盘、荷塘雨课堂" />
    <title>清华校园助手</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <script src="/theme.js?v=__ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/styles.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <a class="skip" href="#view">跳到主要内容</a>
    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="topbar-inner">
        <div class="brand"><span id="view-context" class="view-context">对话工作台</span></div>
        <div class="topbar-meta">
          <span class="chip"><span class="dot" id="health-dot" aria-hidden="true"></span><span id="account" title="应用服务连接状态" role="status"></span></span>
          <div class="theme-switch" role="group" aria-label="配色">
            <button id="theme-light" class="theme-btn" type="button" aria-pressed="true">自然</button>
            <button id="theme-dark" class="theme-btn" type="button" aria-pressed="false">深色</button>
          </div>
          <button id="refresh" class="icon-btn" type="button" title="刷新状态" aria-label="刷新状态"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M5.1 8a7 7 0 0 1 11.6-3L20 9M4 15l3.3 4A7 7 0 0 0 19 16"/></svg></button>
        </div>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <nav class="tabbar" aria-label="主导航">
        <div class="rail-brand"><img src="/icons/icon.svg" alt="" width="30" height="30"/><h1>清华校园助手</h1></div>
        <button class="tab" data-view="chat" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12H9l-4 4V4Z M9 8h6M9 12h4"/></svg><span>对话</span></button>
        <button class="tab" data-view="sessions" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18H6V3Z M9 8h6M9 12h6M9 16h4"/></svg><span>会话</span></button>
        <button class="tab" data-view="services" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4V4Z M14 4h6v6h-6V4Z M4 14h6v6H4v-6Z M14 14h6v6h-6v-6Z"/></svg><span>服务</span></button>
        <button class="tab" data-view="tools" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5 5 5M4 20l7-7M12 4a6 6 0 0 0 8 8l-6 6-8-8 6-6Z"/></svg><span>工具</span></button>
        <button class="tab" data-view="settings" type="button"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></svg><span>设置</span></button>
      </nav>
    </div>

    <section id="pair" class="pair" hidden>
      <div class="card pair-card">
        <h2>连接设备</h2>
        <label class="field">
          <span>服务器地址</span>
          <input id="pair-base" type="url" inputmode="url" placeholder="http://192.168.1.23:8971" autocomplete="off" />
        </label>
        <label class="field">
          <span>配对码</span>
          <input
            id="pair-code"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
          />
        </label>
        <p id="pair-error" class="error" role="alert" hidden></p>
        <button id="pair-submit" class="primary" type="button">配对并连接</button>
        <details class="help-section">
          <summary>获取配对码</summary>
          <p>在已连接设备的“设置”中生成配对码。</p>
          <p>首次启动：<code>node bin/thu-campus.mjs app serve</code>，使用控制台显示的配对码。</p>
        </details>
      </div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
