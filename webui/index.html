<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <meta name="theme-color" content="#f4f3f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0f0e" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="清华校园独立助手：网络学堂、清华云盘、荷塘雨课堂" />
    <title>清华校园助手</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <script src="/theme.js?v=__ASSET_VERSION__"></script>
    <link rel="stylesheet" href="/styles.css?v=__ASSET_VERSION__" />
  </head>
  <body>
    <a class="skip" href="#view">跳到主要内容</a>
    <div id="app" class="app" hidden>
      <header class="topbar">
        <div class="brand">
          <div class="brand-row">
            <span class="dot" id="health-dot" aria-hidden="true"></span>
            <h1>清华校园助手</h1>
          </div>
        </div>
        <div class="topbar-meta">
          <span id="account" class="chip" title="已绑定的校园账号"></span>
          <div class="theme-switch" role="group" aria-label="配色">
            <button id="theme-light" class="theme-btn" type="button" aria-pressed="true">自然</button>
            <button id="theme-dark" class="theme-btn" type="button" aria-pressed="false">深色</button>
          </div>
          <button id="refresh" class="icon-btn" type="button" title="刷新状态" aria-label="刷新状态">⟳</button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <nav class="tabbar" aria-label="主导航">
        <button class="tab" data-view="chat" type="button">对话</button>
        <button class="tab" data-view="sessions" type="button">会话</button>
        <button class="tab" data-view="services" type="button">服务</button>
        <button class="tab" data-view="tools" type="button">工具</button>
        <button class="tab" data-view="settings" type="button">设置</button>
      </nav>
    </div>

    <section id="pair" class="pair" hidden>
      <div class="card pair-card">
        <h2>连接设备</h2>
        <label class="field">
          <span>服务器地址</span>
          <input id="pair-base" type="url" inputmode="url" placeholder="http://192.168.1.23:8971" autocomplete="off" />
        </label>
        <label class="field">
          <span>配对码</span>
          <input
            id="pair-code"
            type="text"
            inputmode="numeric"
            pattern="[0-9]*"
            maxlength="6"
            placeholder="000000"
            autocomplete="one-time-code"
          />
        </label>
        <p id="pair-error" class="error" role="alert" hidden></p>
        <button id="pair-submit" class="primary" type="button">配对并连接</button>
        <details class="help-section">
          <summary>获取配对码</summary>
          <p>在已连接设备的“设置”中生成配对码。</p>
          <p>首次启动：<code>node bin/thu-campus.mjs app serve</code>，使用控制台显示的配对码。</p>
        </details>
      </div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="/app.js?v=__ASSET_VERSION__"></script>
  </body>
</html>
